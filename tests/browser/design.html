<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>World design fixture</title><link rel="stylesheet" href="/styles.css"><style>
:root{--background-primary:#f8fafc;--background-secondary:#eef2f6;--background-modifier-border:#dce3ed;--text-normal:#1e293b;--text-muted:#64748b;--interactive-accent:#6d5ce8;--text-error:#dc2626;--color-yellow:#f59e0b;--font-monospace:monospace;font-family:system-ui,sans-serif;color:var(--text-normal)}*{box-sizing:border-box}body{margin:0;background:var(--background-primary)}button,input,select,textarea{font:inherit;border:1px solid var(--background-modifier-border);background:white;border-radius:6px;color:inherit;padding:7px 10px}button{cursor:pointer}button.mod-cta{background:var(--interactive-accent);color:white}button:disabled{opacity:.5}textarea{resize:vertical}input[type=checkbox]{width:auto}input[type=color]{padding:2px;width:48px;height:32px}label{font-size:13px}small{font-size:12px}.fixture-overlay{position:fixed;inset:0;background:#0007;z-index:4000;display:flex;align-items:center;justify-content:center}.fixture-modal{width:620px;max-width:95vw;max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:24px;box-shadow:0 20px 80px #0005}.fixture-modal input{max-width:100%}.fixture-modal button{margin:4px}.fixture-modal select{max-width:100%}
</style></head><body><div id="root"></div><script type="module" src="/bundle.js"></script></body></html>
