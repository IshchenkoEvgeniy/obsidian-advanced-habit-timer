name: CI

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Root tests import cloudflare-companion/src, which uses its own dependencies.
      - name: Install cloudflare-companion dependencies
        working-directory: cloudflare-companion
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Typecheck + production build (tsc + esbuild)
        run: npm run build

      - name: Tests (vitest)
        run: npm test