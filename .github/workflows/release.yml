name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Parity with ci.yml: root build/tests import cloudflare-companion sources.
      - name: Install cloudflare-companion dependencies
        working-directory: cloudflare-companion
        run: npm ci

      - name: Typecheck + production build (tsc + esbuild)
        run: npm run build

      - name: Read plugin version from manifest
        id: version
        run: echo "version=$(node -p "require('./manifest.json').version")" >> "$GITHUB_OUTPUT"

      - name: Package plugin zip
        run: |
          test -f main.js
          mkdir -p dist
          cp main.js manifest.json styles.css dist/
          cd dist
          zip "../obsidian-advanced-habit-timer-${{ steps.version.outputs.version }}.zip" main.js manifest.json styles.css

      # Ручной запуск: только артефакт, без публикации релиза.
      - name: Upload build artifact (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-advanced-habit-timer-${{ steps.version.outputs.version }}
          path: |
            obsidian-advanced-habit-timer-*.zip
            main.js
            manifest.json
            styles.css
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            obsidian-advanced-habit-timer-*.zip
            main.js
            manifest.json
            styles.css
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
